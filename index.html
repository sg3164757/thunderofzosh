<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Thunder of Zosh | Official Premium Site</title>
    <link rel="icon" type="image/png" href="favicon.png">
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;600;700&display=swap" rel="stylesheet">
    <style>
        :root { --gold: #d4af37; --gold-dark: #b8860b; --white: #ffffff; --dark: #0a0a0a; --footer-bg: #162129; }
        * { box-sizing: border-box; scroll-behavior: smooth; }
        body { font-family: 'Poppins', sans-serif; background-color: var(--dark); color: var(--white); margin: 0; line-height: 1.6; }
        
        nav { display: flex; justify-content: space-between; align-items: center; padding: 15px 5%; background: rgba(0,0,0,0.95); position: sticky; top: 0; z-index: 1000; border-bottom: 1px solid #222; }
        .logo { color: var(--gold); font-weight: 700; font-size: 22px; text-transform: uppercase; letter-spacing: 2px; }

        /* Hero Section */
        .hero { height: 95vh; display: flex; flex-direction: column; align-items: center; justify-content: center; text-align: center; background: linear-gradient(rgba(0,0,0,0.5), rgba(0,0,0,0.5)), url('hero-zosh.jpeg') center/cover; padding: 0 20px; border-bottom: 3px solid var(--gold); }
        .hero h1 { font-size: 60px; color: var(--gold); margin: 0 0 10px; font-weight: 700; text-shadow: 0 0 20px rgba(212,175,55,0.5); }
        
        .cta-btn { padding: 18px 50px; background: linear-gradient(45deg, var(--gold), var(--gold-dark)); color: #000; text-decoration: none; font-weight: 700; border-radius: 5px; text-transform: uppercase; display: inline-block; transition: 0.3s; border: none; cursor: pointer; }

        /* Lifestyle Sections (Jo aapne pucha - Ye wahi hain) */
        .lifestyle-section { min-height: 100vh; display: flex; align-items: center; justify-content: center; background-size: cover; background-position: center; background-attachment: fixed; text-align: center; padding: 40px; }
        .lifestyle-1 { background-image: linear-gradient(rgba(0,0,0,0.7), rgba(0,0,0,0.7)), url('touch_image.jpeg'); border-bottom: 2px solid var(--gold); }
        .lifestyle-2 { background-image: linear-gradient(rgba(0,0,0,0.7), rgba(0,0,0,0.7)), url('smile_image.jpeg'); }

        /* NEW Product Grid */
        .section { padding: 80px 10%; text-align: center; }
        .grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(280px, 1fr)); gap: 30px; }
        .card { background: #111; padding: 25px; border-radius: 12px; border: 1px solid #222; transition: 0.3s; }
        .card:hover { border-color: var(--gold); }
        .card img { width: 100%; height: 250px; object-fit: contain; border-radius: 8px; margin-bottom: 20px; }

        /* Order Form */
        .order-container { max-width: 600px; margin: 40px auto; background: #111; padding: 40px; border-radius: 15px; border: 1px solid var(--gold); display: none; }
        .form-group { margin-bottom: 20px; }
        .form-group label { display: block; margin-bottom: 8px; color: var(--gold); font-weight: 600; }
        input, textarea, select { width: 100%; padding: 12px; border-radius: 5px; border: 1px solid #333; background: #000; color: #fff; }

        #qr-section { display: none; text-align: center; margin-top: 20px; background: #fff; padding: 20px; border-radius: 10px; color: #000; }
        .upi-btn { background: #28a745; color: #fff; padding: 15px; text-decoration: none; display: block; border-radius: 5px; font-weight: 700; margin-top: 10px; }
    </style>
</head>
<body>

<nav>
    <div class="logo">Thunder of Zosh</div>
    <a href="#products" class="cta-btn" style="padding: 10px 20px; font-size: 12px;">Shop Now</a>
</nav>

<section class="hero">
    <h1>THUNDER OF ZOSH</h1>
    <p>Premium Ayurvedic Performance for Men.</p>
    <a href="#products" class="cta-btn">Buy Now</a>
</section>

<section class="lifestyle-section lifestyle-1">
    <div class="lifestyle-content">
        <h2 style="font-size: 45px; color: var(--gold);">Unleash Your Power</h2>
    </div>
</section>

<section class="section" id="products">
    <h2 style="color: var(--gold); margin-bottom: 40px;">CHOOSE YOUR PACK</h2>
    <div class="grid">
        <div class="card">
            <img src="gel-product.jpg" alt="Zosh Gel">
            <h3>Thunder of Zosh Gel</h3>
            <div style="font-size: 24px; color: var(--gold); font-weight: 700; margin: 10px 0;">₹2,999</div>
            <button class="cta-btn" onclick="openOrder('Gel', 2999)">Order Gel</button>
        </div>
        <div class="card">
            <img src="tablet-photo.jpg" alt="Zosh Tablets">
            <h3>Zosh Tablets (30 Caps)</h3>
            <div style="font-size: 24px; color: var(--gold); font-weight: 700; margin: 10px 0;">₹1,999</div>
            <button class="cta-btn" onclick="openOrder('Tablets', 1999)">Order Tablets</button>
        </div>
    </div>
</section>

<section class="lifestyle-section lifestyle-2">
    <div class="lifestyle-content">
        <h2 style="font-size: 45px; color: var(--gold);">Stronger Bonds</h2>
    </div>
</section>

<section id="order-form">
    <div class="order-container" id="form-wrapper">
        <h2 id="order-title" style="color: var(--gold); text-align: center;">CHECKOUT</h2>
        <form id="final-form">
            <div class="form-group"><label>NAME</label><input type="text" id="user-name" required></div>
            <div class="form-group"><label>MOBILE</label><input type="tel" id="user-phone" pattern="[0-9]{10}" required></div>
            <div class="form-group"><label>ADDRESS</label><textarea id="user-addr" rows="3" required></textarea></div>
            
            <label style="color: var(--gold); font-weight: 600;">PAYMENT METHOD</label>
            <select id="pay-method" onchange="toggleQR()" style="margin-bottom: 20px;">
                <option value="COD">Cash on Delivery</option>
                <option value="Online">Online UPI (PhonePe/GPay)</option>
            </select>

            <div id="qr-section">
                <img src="your-qr.png" style="width: 150px;">
                <a id="upi-link" href="#" class="upi-btn">Pay with UPI App</a>
            </div>

            <input type="hidden" id="selected-pkg">
            <button type="submit" class="cta-btn" id="sub-btn" style="width: 100%; margin-top: 20px;">Confirm Order</button>
        </form>
    </div>
</section>

<script>
    const MY_UPI = "YOUR_UPI_ID_HERE"; // Apni UPI ID dalein

    function openOrder(name, price) {
        document.getElementById('form-wrapper').style.display = 'block';
        document.getElementById('order-title').innerText = "ORDER " + name.toUpperCase();
        document.getElementById('selected-pkg').value = name + " (₹" + price + ")";
        window.location.hash = "order-form";
    }

    function toggleQR() {
        const method = document.getElementById('pay-method').value;
        const qr = document.getElementById('qr-section');
        if(method === 'Online') {
            qr.style.display = 'block';
            const amt = document.getElementById('selected-pkg').value.match(/\d+/)[0];
            document.getElementById('upi-link').href = `upi://pay?pa=${MY_UPI}&pn=Zosh&am=${amt}&cu=INR`;
        } else { qr.style.display = 'none'; }
    }

    document.getElementById('final-form').addEventListener('submit', function(e) {
        e.preventDefault();
        const btn = document.getElementById('sub-btn');
        btn.innerText = "Processing...";
        btn.disabled = true;

        const data = {
            "Timestamp": new Date().toLocaleString(),
            "Name": document.getElementById('user-name').value,
            "Phone": document.getElementById('user-phone').value,
            "Package": document.getElementById('selected-pkg').value,
            "Address": document.getElementById('user-addr').value,
            "Status": "New Order - " + document.getElementById('pay-method').value
        };

        // Parallel update: Excel + Email
        Promise.all([
            fetch('https://sheetdb.io/api/v1/2qqhwik4r33j0', {
                method: 'POST',
                headers: {'Content-Type': 'application/json'},
                body: JSON.stringify({data: [data]})
            }),
            fetch('https://formspree.io/f/xeeazdpz', {
                method: 'POST',
                body: JSON.stringify(data),
                headers: {'Accept': 'application/json', 'Content-Type': 'application/json'}
            })
        ]).then(() => {
            document.getElementById('form-wrapper').innerHTML = "<h2 style='color:var(--gold); text-align:center;'>Order Success! ✅</h2>";
        });
    });
</script>
</body>
</html>
