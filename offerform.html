<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Secure Checkout | Thunder of Zosh</title>
    
    <script src="https://checkout.razorpay.com/v1/checkout.js"></script>

    <style>
        :root { --gold: #d4af37; --black: #050505; --card-bg: #111; }
        body { font-family: 'Segoe UI', sans-serif; background: var(--black); color: white; margin: 0; padding: 10px; display: flex; justify-content: center; }
        .order-container { max-width: 450px; width: 100%; background: var(--card-bg); border-radius: 20px; border: 1px solid rgba(212,175,55,0.3); overflow: hidden; box-shadow: 0 15px 35px rgba(0,0,0,0.8); }
        
        /* Premium Header with Image */
        .header { background: #1a1a1a; padding: 15px; text-align: center; border-bottom: 2px solid var(--gold); display: flex; align-items: center; justify-content: center; gap: 15px; }
        .header img { width: 60px; height: 60px; border-radius: 50%; border: 2px solid var(--gold); object-fit: cover; }
        .header h2 { margin: 0; color: var(--gold); letter-spacing: 2px; text-transform: uppercase; font-size: 18px; }
        
        .trust-tag { background: rgba(46, 204, 113, 0.1); color: #2ecc71; font-size: 10px; text-align: center; padding: 8px; font-weight: bold; text-transform: uppercase; }

        /* Price Section */
        .price-box { background: #1a1a1a; margin: 15px 20px; padding: 15px; border-radius: 12px; border-left: 4px solid var(--gold); display: flex; justify-content: space-between; align-items: center; }
        .price-box .amt { color: var(--gold); font-size: 26px; font-weight: 800; }

        form { padding: 0 20px 20px; }
        .group { margin-bottom: 15px; }
        label { display: block; font-size: 10px; color: var(--gold); margin-bottom: 5px; font-weight: bold; letter-spacing: 1px; }
        input, select, textarea { width: 100%; padding: 14px; border-radius: 10px; border: 1px solid #333; background: #000; color: #fff; font-size: 15px; box-sizing: border-box; }
        input:focus { border-color: var(--gold); outline: none; }

        .btn-pay { width: 100%; padding: 18px; background: linear-gradient(45deg, var(--gold), #b8860b); color: #000; border: none; border-radius: 10px; font-size: 17px; font-weight: 900; cursor: pointer; text-transform: uppercase; transition: 0.3s; margin-top: 10px; }
        
        /* Safety Badges */
        .safety-footer { display: flex; justify-content: space-around; padding: 15px; background: #0a0a0a; border-top: 1px solid #222; }
        .badge { font-size: 9px; color: #777; text-align: center; }
        .badge b { display: block; color: var(--gold); font-size: 12px; }

        #success-msg { display: none; padding: 50px 20px; text-align: center; }
    </style>
</head>
<body>

<div class="order-container">
    <div class="trust-tag">🔒 SSL Secured Checkout | Discreet Packaging Verified</div>
    
    <div class="header">
        <img src="model-product.jpg" alt="Zosh"> 
        <div>
            <h2>Thunder of Zosh</h2>
            <p style="font-size:11px; color:#ccc; margin:3px 0 0;">Claim Your Discount Today</p>
        </div>
    </div>

    <div class="price-box">
        <div><span style="font-size:11px; color:#888;">Order Item:</span><br><b>Gold Gel Formula</b></div>
        <div class="amt" id="totalDisplay">₹2,999</div>
    </div>

    <form id="orderForm">
        <div class="group">
            <label>FULL NAME / पूरा नाम</label>
            <input type="text" id="name" placeholder="E.g. Rajesh Singh" required>
        </div>
        <div class="group">
            <label>PHONE NUMBER / फ़ोन नंबर</label>
            <input type="tel" id="phone" pattern="[0-9]{10}" placeholder="10-digit number" required>
        </div>

        <div class="group">
            <label>SELECT YOUR PACK / पैक चुनें</label>
            <select id="package" onchange="updatePrice()">
                <option value="Single Bottle" data-price="2999" selected>Single Bottle (1 Bottle) - ₹2,999</option>
                <option value="Two Bottles" data-price="3999">Two Bottles (2 Bottles) - ₹3,999 (Best Value)</option>
            </select>
        </div>

        <div class="group">
            <label>FULL DELIVERY ADDRESS / पूरा पता</label>
            <textarea id="address" rows="2" placeholder="House No, Street, City, Pincode" required></textarea>
        </div>
        
        <div class="group">
            <label>CHOOSE PAYMENT MODE / भुगतान विधि</label>
            <select id="method">
                <option value="Online">Pay Online (UPI, Card, Wallet)</option>
                <option value="COD" selected>Cash on Delivery (Standard)</option>
            </select>
        </div>
        <button type="submit" class="btn-pay" id="submitBtn">Confirm Secure Order</button>
    </form>

    <div id="success-msg">
        <div style="font-size: 50px;">💎</div>
        <h2 style="color:var(--gold);">ORDER CONFIRMED!</h2>
        <p>Thank you! Your package will be delivered discreetly in 3-5 days.</p>
    </div>

    <div class="safety-footer">
        <div class="badge"><b>FREE</b>Shipping</div>
        <div class="badge"><b>PRIVATE</b>Packaging</div>
        <div class="badge"><b>AYURVEDIC</b>Certified</div>
    </div>
</div>

<script>
    // Aapki Verify ki gayi details
    const RAZORPAY_KEY = "rzp_test_SWHwh86PML4ws8"; 
    const SHEET_URL = 'https://sheetdb.io/api/v1/o0o8niq42cwl8';

    // Pricing Logic
    const PRICES = {
        "Single Bottle": 2999,
        "Two Bottles": 3999
    };

    function updatePrice() {
        const pkg = document.getElementById('package').value;
        const price = PRICES[pkg];
        document.getElementById('totalDisplay').innerText = "₹" + price.toLocaleString('en-IN');
    }

    // Pehle price set kijiye
    updatePrice();

    document.getElementById('orderForm').addEventListener('submit', async function(e) {
        e.preventDefault();
        const btn = document.getElementById('submitBtn');
        const method = document.getElementById('method').value;
        const pkgName = document.getElementById('package').value;
        const totalAmount = PRICES[pkgName];
        
        const data = {
            "Timestamp": new Date().toLocaleString('en-IN'),
            "Name": document.getElementById('name').value,
            "Phone": document.getElementById('phone').value,
            "Address": document.getElementById('address').value,
            "Package": pkgName,
            "Method": method,
            "Status": "Pending / Initialized",
            "Bill": "₹" + totalAmount.toLocaleString('en-IN')
        };

        // STEP 1: Turant Lead capture karein (Data Safety)
        try {
            await fetch(SHEET_URL, {
                method: 'POST',
                headers: {'Content-Type': 'application/json'},
                body: JSON.stringify({data: [data]})
            });
        } catch(err) { console.log("Locally Saved"); }

        if (method === 'Online') {
            btn.innerHTML = "Opening Secure Gateway...";
            btn.disabled = true;

            var options = {
                "key": RAZORPAY_KEY,
                "amount": totalAmount * 100, // Paise mein (Amount * 100)
                "currency": "INR",
                "name": "Thunder of Zosh",
                "description": "Prepaid Order: " + pkgName,
                "handler": async function (response) {
                    // Payment successful hone par update karein
                    updateSheetStatus(data.Phone, "PAID - ID: " + response.razorpay_payment_id);
                    finishOrder();
                },
                "modal": {
                    "ondismiss": function() {
                        updateSheetStatus(data.Phone, "Cancelled/Pending");
                        btn.disabled = false;
                        btn.innerHTML = "Confirm Secure Order";
                    }
                },
                "prefill": {"name": data.Name, "contact": data.Phone},
                "theme": {"color": "#d4af37"}
            };
            var rzp = new Razorpay(options);
            rzp.on('payment.failed', function (resp) {
                updateSheetStatus(data.Phone, "FAILED: " + resp.error.description);
                alert("Payment Failed. Try again or choose COD.");
            });
            rzp.open();
        } else {
            // COD Logic
            btn.innerHTML = "Confirming COD Order...";
            await updateSheetStatus(data.Phone, "COD - Confirmed");
            finishOrder();
        }
    });

    async function updateSheetStatus(phone, status) {
        try {
            await fetch(SHEET_URL + '/Phone/' + phone, {
                method: 'PATCH',
                headers: {'Content-Type': 'application/json'},
                body: JSON.stringify({data: {"Status": status}})
            });
        } catch(e) { console.error("Update Error"); }
    }

    function finishOrder() {
        document.getElementById('orderForm').style.display = 'none';
        document.querySelector('.price-box').style.display = 'none';
        document.querySelector('.safety-footer').style.display = 'none';
        document.getElementById('success-msg').style.display = 'block';
        window.scrollTo(0,0);
    }
</script>

</body>
</html>
