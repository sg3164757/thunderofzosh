<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Secure Checkout | Thunder of Zosh</title>
    <script src="https://checkout.razorpay.com/v1/checkout.js"></script>
    <script>
        !function(f,b,e,v,n,t,s)
        {if(f.fbq)return;n=f.fbq=function(){n.callMethod?
        n.callMethod.apply(n,arguments):n.queue.push(arguments)};
        if(!f._fbq)f._fbq=n;n.push=n;n.loaded=!0;n.version='2.0';
        n.queue=[];t=b.createElement(e);t.async=!0;
        t.src=v;s=b.getElementsByTagName(e)[0];
        s.parentNode.insertBefore(t,s)}(window, document,'script',
        'https://connect.facebook.net/en_US/fbevents.js');
        fbq('init', '881403324800547'); 
        fbq('track', 'PageView');
    </script>
    <style>
        :root { --gold: #d4af37; --black: #0a0a0a; --field-bg: #1a1a1a; }
        body { font-family: 'Segoe UI', sans-serif; background-color: #000; color: white; margin: 0; padding: 10px; }
        .order-container { max-width: 450px; margin: 10px auto; background: #111; border-radius: 20px; border: 1px solid var(--gold); overflow: hidden; }
        .form-header { background: #1a1a1a; border-bottom: 2px solid var(--gold); display: flex; align-items: center; padding: 15px; }
        .header-model-photo { width: 70px; height: 70px; border-radius: 50%; border: 2px solid var(--gold); object-fit: cover; margin-right: 15px; }
        .price-box { background: rgba(212,175,55,0.1); margin: 15px 25px; padding: 10px; border-radius: 10px; border: 1px dashed var(--gold); text-align: center; }
        form { padding: 20px; }
        .field-group { margin-bottom: 15px; }
        label { display: block; font-size: 11px; color: var(--gold); margin-bottom: 5px; font-weight: bold; }
        input, select, textarea { width: 100%; padding: 12px; border-radius: 8px; border: 1px solid #333; background: var(--field-bg); color: #fff; box-sizing: border-box; }
        .btn-submit { width: 100%; padding: 15px; background: linear-gradient(45deg, var(--gold), #b8860b); color: #000; border: none; border-radius: 10px; font-size: 16px; font-weight: bold; cursor: pointer; text-transform: uppercase; }
        #success-msg { display: none; padding: 40px 20px; text-align: center; }
    </style>
</head>
<body>

<div class="order-container">
    <div class="form-header">
        <img src="product-new.jpg" alt="Zosh" class="header-model-photo">
        <div>
            <h2 style="margin:0; font-size:18px; color:var(--gold);">THUNDER OF ZOSH</h2>
            <p style="margin:0; font-size:12px; color:#aaa;">Premium Performance Gel</p>
        </div>
    </div>

    <div class="price-box">
        <h3 style="margin:0; color:var(--gold);">Single Bottle: ₹2,999</h3>
    </div>

    <form id="orderForm">
        <div class="field-group">
            <label>FULL NAME</label>
            <input type="text" id="name" required>
        </div>
        <div class="field-group">
            <label>PHONE NUMBER</label>
            <input type="tel" id="phone" pattern="[0-9]{10}" required>
        </div>
        <div class="field-group">
            <label>PAYMENT METHOD</label>
            <select id="method">
                <option value="Online">Pay Online (Prepaid)</option>
                <option value="COD">Cash on Delivery (COD)</option>
            </select>
        </div>
        <div class="field-group">
            <label>ADDRESS</label>
            <textarea id="address" rows="2" required></textarea>
        </div>
        <div class="address-row" style="display:flex; gap:10px;">
            <div class="field-group" style="flex:1;">
                <label>CITY</label>
                <input type="text" id="city" required>
            </div>
            <div class="field-group" style="flex:1;">
                <label>PINCODE</label>
                <input type="text" id="pincode" pattern="[0-9]{6}" required>
            </div>
        </div>
        <button type="submit" class="btn-submit" id="submitBtn">Confirm Order Now</button>
    </form>

    <div id="success-msg">
        <h2 style="color:var(--gold);">ORDER PLACED! ✅</h2>
        <p>Thank you for your order. We will contact you shortly.</p>
    </div>
</div>

<script>
    const RAZORPAY_KEY = "rzp_test_SMO84KjGV4oOVD1kl9kP9Yosq"; // Updated Key
    const SHEET_URL = 'https://sheetdb.io/api/v1/o0o8niq42cwl8';

    document.getElementById('orderForm').addEventListener('submit', async function(e) {
        e.preventDefault();
        const btn = document.getElementById('submitBtn');
        btn.disabled = true;
        btn.innerHTML = "Processing...";

        const formData = {
            "Timestamp": new Date().toLocaleString('en-IN'),
            "Name": document.getElementById('name').value,
            "Phone": document.getElementById('phone').value,
            "Address": document.getElementById('address').value,
            "City": document.getElementById('city').value,
            "Pincode": document.getElementById('pincode').value,
            "Method": document.getElementById('method').value,
            "Status": "Pending / Initialized"
        };

        // STEP 1: Pehle Lead save karo (Taki agar user payment cancel kare to data mil jaye)
        await fetch(SHEET_URL, {
            method: 'POST',
            headers: {'Content-Type': 'application/json'},
            body: JSON.stringify({data: [formData]})
        });

        if (formData.Method === 'Online') {
            // STEP 2: Razorpay Popup
            var options = {
                "key": RAZORPAY_KEY,
                "amount": 299900,
                "currency": "INR",
                "name": "Thunder of Zosh",
                "description": "Prepaid Order",
                "handler": async function (response) {
                    // Agar payment success hui to Excel update karo
                    await fetch(SHEET_URL + '/Phone/' + formData.Phone, {
                        method: 'PATCH',
                        headers: {'Content-Type': 'application/json'},
                        body: JSON.stringify({data: {"Status": "Paid - ID: " + response.razorpay_payment_id}})
                    });
                    showSuccess();
                },
                "modal": {
                    "ondismiss": function() {
                        // Agar user popup band kar de
                        fetch(SHEET_URL + '/Phone/' + formData.Phone, {
                            method: 'PATCH',
                            headers: {'Content-Type': 'application/json'},
                            body: JSON.stringify({data: {"Status": "Payment Failed/Cancelled"}})
                        });
                        alert("Payment was not completed. Your order is marked as Pending.");
                        btn.disabled = false;
                        btn.innerHTML = "Confirm Order Now";
                    }
                },
                "prefill": {"name": formData.Name, "contact": formData.Phone},
                "theme": {"color": "#d4af37"}
            };
            var rzp = new Razorpay(options);
            rzp.open();
        } else {
            // COD Logic
            await fetch(SHEET_URL + '/Phone/' + formData.Phone, {
                method: 'PATCH',
                headers: {'Content-Type': 'application/json'},
                body: JSON.stringify({data: {"Status": "COD Confirmed"}})
            });
            showSuccess();
        }
    });

    function showSuccess() {
        document.getElementById('orderForm').style.display = 'none';
        document.getElementById('success-msg').style.display = 'block';
        fbq('track', 'Lead');
    }
</script>
</body>
</html>
