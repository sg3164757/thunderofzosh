<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Thunder of Zosh | Official Brand Site</title>
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;600;700&display=swap" rel="stylesheet">
    <style>
        :root { --gold: #d4af37; --gold-dark: #b8860b; --white: #ffffff; --dark: #0a0a0a; }
        * { box-sizing: border-box; scroll-behavior: smooth; }
        body { font-family: 'Poppins', sans-serif; background-color: var(--dark); color: var(--white); margin: 0; line-height: 1.6; }
        
        nav { display: flex; justify-content: space-between; align-items: center; padding: 15px 5%; background: rgba(0,0,0,0.95); position: sticky; top: 0; z-index: 1000; border-bottom: 1px solid #222; }
        .logo { color: var(--gold); font-weight: 700; font-size: 22px; text-transform: uppercase; letter-spacing: 2px; }

        /* Lightning Hero Section */
        .hero { height: 95vh; display: flex; flex-direction: column; align-items: center; justify-content: center; text-align: center; background: linear-gradient(rgba(0,0,0,0.5), rgba(0,0,0,0.5)), url('hero-zosh.jpeg') center/cover; padding: 0 20px; border-bottom: 3px solid var(--gold); }
        .hero h1 { font-size: 60px; color: var(--gold); margin: 0 0 10px; font-weight: 700; }
        
        /* Model Image Section */
        .model-section { display: flex; align-items: center; padding: 60px 10%; background: #050505; flex-wrap: wrap; gap: 40px; }
        .model-img-container { flex: 1; min-width: 300px; text-align: center; }
        .model-img-container img { width: 100%; max-width: 500px; border-radius: 15px; border: 1px solid var(--gold); }

        .section { padding: 60px 10%; text-align: center; }
        .grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(250px, 1fr)); gap: 25px; }
        .card { background: #111; padding: 20px; border-radius: 10px; border: 1px solid #222; }
        .card img { width: 100%; height: 200px; object-fit: cover; border-radius: 8px; margin-bottom: 15px; }
    </style>
</head>
<body>

<nav>
    <div class="logo">Thunder of Zosh</div>
</nav>

<section class="hero">
    <h1>THUNDER OF ZOSH</h1>
    <p>Premium Ayurvedic Formula</p>
</section>

<section class="model-section">
    <div class="model-img-container">
        <img src="model-zosh.jpeg" alt="Thunder of Zosh Model">
    </div>
    <div style="flex:1;">
        <h2 style="color:var(--gold);">Unleash Your Power</h2>
        <p>Expertly crafted for peak vitality and confidence.</p>
    </div>
</section>

<section class="section">
    <h2 style="color:var(--gold); margin-bottom:40px;">Pure Ingredients</h2>
    <div class="grid">
        <div class="card">
            <img src="ashwa.jpeg" alt="Ashwagandha">
            <h3>Ashwagandha</h3>
        </div>
        <div class="card">
            <img src="shilajit.jpeg" alt="Shilajit">
            <h3>Shilajit</h3>
        </div>
        <div class="card">
            <img src="musli.jpeg" alt="Safed Musli">
            <h3>Safed Musli</h3>
        </div>
    </div>
</section>

</body>
</html>
